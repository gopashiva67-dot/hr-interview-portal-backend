<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - HR Interview Portal</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            HR Interview Portal
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- REGISTER SECTION -->

    <section class="login-section">

        <div class="login-card">

            <div class="login-header">

                <div class="login-icon">
                    👤
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Register to use the HR Interview Portal
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- ACCOUNT TYPE -->

                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="HR">
                            HR / Recruiter
                        </option>

                        <option value="CANDIDATE">
                            Candidate
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="../js/main.js"></script>

</body>

</html>
